# main 에 푸시될 때마다 정적 빌드를 만들어 GitHub Pages 에 배포한다.
#
# 사용자가 직접 할 일 (한 번):
#   1. 저장소 Settings → Secrets and variables → Actions 에 아래 VITE_* secret 을 등록.
#      VITE_ 접두어 환경변수는 빌드 시점 값이 번들에 그대로 박히므로(.env 는 CI에 없음)
#      빠진 값은 배포된 사이트에서 해당 기능(로그인·Dropbox 등)이 동작하지 않는다
#   2. 저장소 Settings → Pages → Source 를 "GitHub Actions" 로 설정
#      (그 전까지는 기존 gh-pages 브랜치가 계속 서빙되고 deploy 잡은 실패한다)
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_API_KEY: ${{ secrets.VITE_GOOGLE_API_KEY }}
          VITE_DROPBOX_APP_KEY: ${{ secrets.VITE_DROPBOX_APP_KEY }}
          VITE_DROPBOX_APP_SECRET: ${{ secrets.VITE_DROPBOX_APP_SECRET }}
          VITE_ALLOWED_EMAILS: ${{ secrets.VITE_ALLOWED_EMAILS }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
