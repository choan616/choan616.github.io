<!-- 실제 앱을 띄우고 ?rm= 로 지정한 요소를 빼서 iOS '자동 완성 연락처' 원인을 좁히는 임시 테스트 페이지 -->
<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AutoFill 앱 테스트</title>
</head>
<body>
  <div id="root"></div>
  <script>
    // 빌드마다 번들 해시가 바뀌므로 운영 index.html 에서 스타일·스크립트 태그를 읽어와 붙인다
    const REMOVABLE = {
      select: '.calendar-navigation select',
      search: '.search-form',
    };
    const rm = (new URLSearchParams(location.search).get('rm') || '').split(',').map(s => s.trim());
    const targets = rm.map(s => REMOVABLE[s]).filter(Boolean);

    const strip = () => {
      targets.forEach(sel => document.querySelectorAll(sel).forEach(el => el.remove()));
      // outside: 에디터 form 이 뜨면 그 조상들의 형제를 모두 지워 form 만 남긴다
      const form = document.querySelector('form.editor-form');
      if (rm.includes('outside') && form) {
        for (let node = form; node && node !== document.body; node = node.parentElement) {
          [...node.parentElement.children].forEach(sib => { if (sib !== node && sib.tagName !== 'SCRIPT') sib.remove(); });
        }
      }
      // fields: form 안에 제목 칸만 남긴다
      if (rm.includes('fields') && form) {
        form.querySelectorAll('textarea, .input-tags, .image-upload-section').forEach(el => el.remove());
      }
      // clone: React 가 관리하는 form 을 같은 모양의 일반 DOM 복제본으로 바꾼다
      if (rm.includes('clone') && form && !form.dataset.cloned) {
        const copy = form.cloneNode(true);
        copy.dataset.cloned = '1';
        copy.onsubmit = () => false;
        form.replaceWith(copy);
      }
      // readonly: 입력칸을 읽기 전용으로 두고 터치하는 순간 해제한다 (알려진 자동완성 회피법)
      if (rm.includes('readonly')) {
        document.querySelectorAll('.input-title, .input-content, .input-tags').forEach(el => {
          if (el.dataset.ro) return;
          el.dataset.ro = '1';
          el.readOnly = true;
          const release = () => { el.readOnly = false; };
          el.addEventListener('touchstart', release, { passive: true });
          el.addEventListener('mousedown', release);
          el.addEventListener('blur', () => { el.readOnly = true; });
        });
      }
      // css: 앱 스타일(링크·styled-components·인라인 style)을 모두 뺀다
      if (rm.includes('css')) {
        document.querySelectorAll('style, link[rel=stylesheet]').forEach(el => el.remove());
      }
    };
    new MutationObserver(strip).observe(document.documentElement, { childList: true, subtree: true });

    fetch('/?t=' + Date.now()).then(r => r.text()).then(html => {
      const doc = new DOMParser().parseFromString(html, 'text/html');
      doc.head.querySelectorAll('link, script[type=module]').forEach(src => {
        if (rm.includes('css') && src.rel === 'stylesheet') return;
        if (rm.includes('nomanifest') && src.rel === 'manifest') return;
        const el = document.createElement(src.tagName);
        for (const a of src.attributes) el.setAttribute(a.name, a.value);
        document.head.appendChild(el);
      });
    });
  </script>
</body>
</html>
