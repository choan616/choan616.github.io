<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>했어?</title>
  <meta name="description" content="외출 전, 이동 전 잊은 물건이나 꺼야 할 전자기기가 없는지 음성과 큰 글씨로 쉽고 확실하게 점검할 수 있는 건망증 방지 체크리스트 서비스입니다.">
  <!-- Google Fonts: Outfit, Noto Sans KR -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
  <!-- CSS Stylesheet -->
  <link rel="stylesheet" href="index.css">
</head>
<body class="theme-dark font-size-medium">
  <!-- 전체 완료 오버레이 애니메이션 -->
  <div id="celebration-overlay" class="celebration-overlay hidden">
    <div class="celebration-content">
      <div class="celebration-icon">🎉</div>
      <h2 id="celebration-title">준비 완료!</h2>
      <p id="celebration-desc">모든 확인을 끝마쳤습니다.<br>이제 안심하고 출발하셔도 좋습니다!</p>
      <button type="button" id="btn-close-celebration" class="btn-primary">확인 완료</button>
    </div>
  </div>

  <div class="app-container">
    <!-- 상단 헤더 -->
    <header class="app-header">
      <div class="logo-area">
        <span class="logo-icon">✅</span>
        <h1 class="logo-text" id="app-main-title">했어?<span class="logo-sub">YouDid</span></h1>
      </div>
      
      <!-- 접근성 및 테마 컨트롤러 -->
      <div class="header-controls">
        <!-- 글자 크기 조절 -->
        <div class="control-group" aria-label="글자 크기 조절">
          <span class="control-label">글자 크기</span>
          <button type="button" id="btn-size-normal" class="btn-toggle active" title="보통 글자 크기">가</button>
          <button type="button" id="btn-size-large" class="btn-toggle" title="큰 글자 크기">가+</button>
          <button type="button" id="btn-size-huge" class="btn-toggle" title="매우 큰 글자 크기">가++</button>
        </div>
        <!-- 테마 조절 -->
        <div class="control-group" aria-label="화면 테마 조절">
          <span class="control-label">모드</span>
          <button type="button" id="btn-theme-dark" class="btn-toggle active" title="다크 테마">어둡게</button>
          <button type="button" id="btn-theme-light" class="btn-toggle" title="라이트 테마">밝게</button>
          <button type="button" id="btn-theme-high" class="btn-toggle" title="고대비 테마">선명하게</button>
        </div>
      </div>
    </header>

    <main class="app-main">
      <!-- 상황(카테고리) 선택 섹션 -->
      <section class="preset-section" aria-labelledby="preset-title">
        <h2 id="preset-title" class="sr-only">상황 선택</h2>
        <div class="preset-select-container">
          <label for="select-preset" class="select-label">현재 어떤 상황인가요?</label>
          <div class="select-wrapper">
            <select id="select-preset" class="custom-select">
              <!-- JS로 상황 목록 동적 로드 -->
            </select>
          </div>
          <!-- TTS 전체 안내 토글 -->
          <div class="tts-master-control">
            <label class="switch-container">
              <input type="checkbox" id="chk-tts-enable" checked>
              <span class="switch-slider"></span>
              <span class="switch-text">눌렀을 때 음성으로 읽어주기</span>
            </label>
          </div>
        </div>
      </section>

      <!-- 체크리스트 컨테이너 -->
      <section class="checklist-section" aria-labelledby="checklist-title">
        <div class="section-header">
          <h2 id="checklist-title">점검 목록 <span id="checklist-progress-text" class="progress-badge">0 / 0</span></h2>
          <div class="progress-bar-container">
            <div id="progress-bar-fill" class="progress-bar-fill" style="width: 0%;"></div>
          </div>
        </div>

        <!-- 실제 체크리스트 목록 -->
        <div id="checklist-items" class="checklist-grid">
          <!-- JS로 동적 생성 -->
        </div>
      </section>

      <!-- 관리자/설정 섹션 (하단 서랍 또는 토글식 구성) -->
      <section class="management-section" aria-labelledby="management-title">
        <div class="accordion-header">
          <button type="button" id="btn-toggle-manage" class="btn-secondary" aria-expanded="false" aria-controls="management-content">
            ⚙️ 항목 편집 / 추가하기
          </button>
        </div>
        
        <div id="management-content" class="management-content hidden">
          <div class="manage-grid">
            <!-- 항목 추가 폼 -->
            <div class="add-item-box">
              <h3>새 항목 추가</h3>
              <form id="form-add-item" class="manage-form" onsubmit="return false;">
                <div class="form-group">
                  <label for="input-item-text">점검할 내용</label>
                  <input type="text" id="input-item-text" placeholder="예: 가스밸브 잠그기, 지갑 챙기기" required>
                </div>
                <div class="form-group">
                  <label for="select-item-preset">소속 상황</label>
                  <select id="select-item-preset">
                    <!-- JS로 채워짐 -->
                  </select>
                </div>
                <button type="submit" id="btn-submit-add" class="btn-primary">목록에 추가</button>
              </form>
            </div>

            <!-- 프리셋 편집/추가 폼 -->
            <div class="add-preset-box">
              <h3>새 상황(카테고리) 추가</h3>
              <form id="form-add-preset" class="manage-form" onsubmit="return false;">
                <div class="form-group">
                  <label for="input-preset-title">새로운 상황 이름</label>
                  <input type="text" id="input-preset-title" placeholder="예: 여행갈 때, 운동 나갈 때" required>
                </div>
                <div class="form-group">
                  <label for="input-preset-icon">아이콘 (이모지)</label>
                  <input type="text" id="input-preset-icon" placeholder="예: 🚗, 🏃, 🎒" maxLength="2" defaultValue="🎒">
                </div>
                <button type="submit" id="btn-submit-add-preset" class="btn-primary">상황 추가</button>
              </form>
            </div>
          </div>

          <!-- 현재 상황별 목록 리스트 관리 (삭제 가능 목록) -->
          <div class="current-items-manager">
            <h3>현재 등록된 점검 목록 편집</h3>
            <div id="manage-items-list" class="manage-items-list">
              <!-- JS로 상황에 등록된 항목들을 목록으로 띄우고 삭제 버튼 구성 -->
            </div>
            
            <div class="preset-reset-container">
              <button type="button" id="btn-reset-data" class="btn-danger">초기 기본 설정으로 전체 초기화</button>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="app-footer">
      <p>&copy; 2026 했어?. 내일도 안심하고 출발하세요.</p>
    </footer>
  </div>

  <!-- JavaScript -->
  <script src="app.js"></script>
</body>
</html>
